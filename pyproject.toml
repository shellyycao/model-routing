[project]
name = "model-routing-xai"
version = "0.1.0"
description = "Explainable multi-model routing for end-to-end knowledge workflows (research framework)."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.42",
  "pydantic>=2.7",
  "pyyaml>=6",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: makes real, paid AWS Bedrock calls (enable with RUN_LIVE=1)"]
